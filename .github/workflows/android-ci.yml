name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-build:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set automatic app version from commit count
        run: echo "CALLGUARD_BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests
        run: gradle :android:app:testDebugUnitTest

      - name: Assemble debug APK
        run: gradle :android:app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: callguard-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  emulator-smoke:
    name: Android API 35 emulator smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set automatic app version from commit count
        run: echo "CALLGUARD_BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :android:app:assembleDebug

      # The emulator runner requires KVM permissions on Linux GitHub-hosted runners.
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # KVM is not exposed on every hosted runner image. Do not fail here;
          # the emulator is configured to use software acceleration below.
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            echo "KVM device detected and permissions configured."
          else
            echo "KVM device unavailable; emulator will use software acceleration."
          fi

      - name: Boot Android emulator and launch app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-port: 5554
          emulator-boot-timeout: 1200
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data
          disable-animations: true
          disable-linux-hw-accel: true
          cores: 2
          ram-size: 2048
          heap-size: 512
          script: |
            set -euo pipefail
            adb devices -l
            adb wait-for-device
            timeout 120s bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 2; done'
            adb shell getprop sys.boot_completed
            timeout 15m gradle :android:app:connectedDebugAndroidTest
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.mainak.callguardai
            adb shell monkey -p com.mainak.callguardai 1
            sleep 5
            adb shell dumpsys activity activities | grep -q com.mainak.callguardai

      - name: Capture emulator diagnostics on failure
        if: failure()
        run: |
          adb devices -l || true
          pgrep -af 'emulator|qemu' || true
          ls -la "$HOME/.android/avd" || true
          adb -s emulator-5554 shell getprop sys.boot_completed || true
          adb -s emulator-5554 logcat -d -t 1500 || true
