name: Publish APK to Website

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "gradle/**"
      - "gradlew"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - "website/**"
      - ".github/workflows/publish-website-apk.yml"

permissions:
  contents: write

concurrency:
  group: publish-website-apk-v2
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh main before building
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set automatic app version from commit count
        run: echo "CALLGUARD_BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate signing secrets and install release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/callguard-release.jks"
          test -s "$RUNNER_TEMP/callguard-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/callguard-release.jks" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: gradle :android:app:testDebugUnitTest

      - name: Build signed release APK
        run: gradle :android:app:assembleRelease

      - name: Verify APK signature and non-debuggable manifest
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$AAPT"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          if "$AAPT" dump badging "$APK" | grep -q "application-debuggable"; then
            echo "::error::Refusing to publish a debuggable APK"
            exit 1
          fi

      - name: Publish APK and version metadata
        run: |
          mkdir -p website/downloads
          cp android/app/build/outputs/apk/release/app-release.apk website/downloads/callguard-ai.apk
          printf '{"versionName":"0.3.%s","versionCode":%s,"sourceCommit":"%s"}\n' "$CALLGUARD_BUILD_NUMBER" "$CALLGUARD_BUILD_NUMBER" "$(git rev-parse HEAD)" > website/version.json

      - name: Commit website release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/downloads/callguard-ai.apk website/version.json
          if git diff --cached --quiet; then
            echo "Website APK and version metadata are already up to date."
          else
            git commit -m "Publish CallGuard AI website release"
            git push origin HEAD:main
          fi
