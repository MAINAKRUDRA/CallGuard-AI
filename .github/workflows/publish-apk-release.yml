name: Publish Android APK Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      confirm_release:
        description: "Confirm publishing a signed production APK from this tag"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  emulator-smoke:
    name: Android API 35 emulator instrumentation
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.confirm_release == true)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set automatic app version from commit count
        run: echo "CALLGUARD_BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle :android:app:assembleDebug

      - name: Run Android API 35 emulator tests and launch app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 1200
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data
          disable-animations: true
          cores: 2
          ram-size: 2048
          heap-size: 512
          script: |
            timeout 15m gradle :android:app:connectedDebugAndroidTest
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.mainak.callguardai
            adb shell monkey -p com.mainak.callguardai 1
            sleep 5
            adb shell dumpsys activity activities | grep -q com.mainak.callguardai

  build-and-release:
    needs: emulator-smoke
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.confirm_release == true)
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate signing secrets and install release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/callguard-release.jks"
          test -s "$RUNNER_TEMP/callguard-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/callguard-release.jks" >> "$GITHUB_ENV"

      - name: Set automatic app version from commit count
        run: echo "CALLGUARD_BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: gradle :android:app:testDebugUnitTest

      - name: Build signed release APK
        run: gradle :android:app:assembleRelease

      - name: Verify APK signature and non-debuggable manifest
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$AAPT"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          if "$AAPT" dump badging "$APK" | grep -q "application-debuggable"; then
            echo "::error::Refusing to publish a debuggable APK"
            exit 1
          fi

      - name: Prepare release asset
        run: cp android/app/build/outputs/apk/release/app-release.apk callguard-ai.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CallGuard AI ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: false
          files: callguard-ai.apk
