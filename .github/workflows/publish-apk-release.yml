name: Publish Android APK Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run unit tests
        run: gradle :android:app:testDebugUnitTest
      - name: Build APK
        run: gradle :android:app:assembleDebug
      - name: Prepare release asset
        run: cp android/app/build/outputs/apk/debug/app-debug.apk callguard-debug.apk
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CallGuard AI ${{ github.ref_type == 'tag' && github.ref_name || 'development build' }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('manual-{0}', github.run_number) }}
          generate_release_notes: true
          prerelease: true
          files: callguard-debug.apk
